[pytest]
# 命令行参数
addopts = -vs --alluredir=./report/json --clean-alluredir --reruns=1 --reruns-delay=2 --tb=short

# 测试路径
testpaths = ./testcases

# 文件匹配规则
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 日志配置
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %H:%M:%S

# 忽略警告
filterwarnings =
    ignore::DeprecationWarning
    ignore::urllib3.exceptions.InsecureRequestWarning